name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            args: --no-default-features
          - name: window
            args: --no-default-features --features window
          - name: image-export
            args: --no-default-features --features image-export
          - name: flat-view
            args: --no-default-features --features flat-view
          - name: editor
            args: --no-default-features --features editor
          - name: all-features
            args: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native window dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev
      - name: Check ${{ matrix.name }}
        run: cargo check ${{ matrix.args }}

  quality:
    name: tests, examples, and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native window dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev
      - name: Formatting
        run: cargo fmt --check
      - name: Core tests
        run: cargo test --no-default-features
      - name: Flat-view tests
        run: cargo test --no-default-features --features flat-view
      - name: Complete tests
        run: cargo test --all-features
      - name: Examples
        run: cargo check --all-features --examples
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
